<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login – Expense Tracker</title><link rel="stylesheet" href="css/style.css">
</head><body>
<div class="auth-wrap">
  <section class="auth-hero">
    <h1>💰 Personal Expense Tracker</h1>
    <p>Know where every rupee goes.</p>
    <ul><li>📊 Live dashboard &amp; spending analysis</li><li>🎯 Monthly budgets with alerts</li><li>🔍 Search, filter &amp; export to CSV</li><li>🌙 Dark mode</li></ul>
  </section>
  <section class="auth-card">
    <form id="form" novalidate>
      <h2>Welcome back</h2><p class="sub">Log in to your account</p>
      <div class="field"><label>Email</label><input type="email" id="email" placeholder="you@example.com" autocomplete="email" required></div>
      <div class="field"><label>Password</label>
        <div class="pw-wrap"><input type="password" id="password" placeholder="Your password" autocomplete="current-password" required>
        <button type="button" id="eye" aria-label="Show password">👁</button></div></div>
      <div class="err" id="err"></div>
      <div id="backendStatus" style="font-size:.85rem;margin:6px 0 12px"></div>
      <button class="btn" style="width:100%;justify-content:center" id="submit">Log in</button>
      <p style="text-align:center;margin-top:18px">New here? <a href="register.html">Create an account</a></p>
    </form>
  </section>
</div>
<script src="js/config.js"></script><script src="js/common.js"></script>
<script>
if (getToken()) location.href = "dashboard.html";
showBackendStatus($("#backendStatus"));
$("#eye").onclick = () => { const p = $("#password"); p.type = p.type === "password" ? "text" : "password"; };
$("#form").addEventListener("submit", async e => {
  e.preventDefault();
  const email = $("#email").value.trim(), password = $("#password").value;
  $("#err").textContent = "";
  if (!/^\S+@\S+\.\S+$/.test(email)) return $("#err").textContent = "Enter a valid email address";
  if (!password) return $("#err").textContent = "Enter your password";
  const btn = $("#submit"); btn.disabled = true; btn.textContent = "Logging in…";
  try {
    saveSession(await api("/auth/login", { method: "POST", body: JSON.stringify({ email, password }) }));
    location.href = "dashboard.html";
  } catch (ex) { $("#err").textContent = ex.message; btn.disabled = false; btn.textContent = "Log in"; }
});
</script></body></html>
